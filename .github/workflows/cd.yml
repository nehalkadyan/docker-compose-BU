# CD - Continuous Deployment
name: CD Pipeline/workflow
# events on which this workflow gets triggered
on:
  push:
    branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     node-version: [18.x, 20.x, 22.x]
    #     # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    # switch into main branch
    - uses: actions/checkout@v4
    # - name: Use Node.js ${{ matrix.node-version }}
    #   uses: actions/setup-node@v4
    #   with:
    #     node-version: ${{ matrix.node-version }}
    #     cache: 'npm'
    - name: Build Docker Image
      run: docker build -t nehal524/bu-fsd-node-app:latest .

    - name: Docker Image Built
      run: echo "Docker Image Built successfully!"

    - name: Login to Docker
      run: echo "${{secrets.DOCKER_HUB_PASSWORD}}" | docker login -u "${{secrets.DOCKER_USERNAME}}"
       --password-stdin

    - name: Push Image to Docker hub
      run: docker push nehal524/bu-fsd-node-app:latest

